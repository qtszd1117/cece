*{margin:0;padding:0;box-sizing:border-box}

@keyframes fall{0%{transform:translateY(-20px) rotate(0deg) translateX(0);opacity:0}10%{opacity:0.3}90%{opacity:0.2}100%{transform:translateY(105vh) rotate(720deg) translateX(80px);opacity:0}}

/* 音乐按钮 */

.music-btn:active{transform:scale(0.9)}
.music-btn.playing{animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,160,120,0.3)}50%{box-shadow:0 0 0 8px rgba(180,160,120,0)}}

/* 页面 */

.start-page h1{font-size:2em;color:#3a3028;line-height:1.5;margin-bottom:12px;font-weight:400}
.start-meta{font-size:12px;color:#b8a88a;letter-spacing:1px;margin-bottom:40px;line-height:2}
.start-desc{font-size:14px;color:#8a7e6e;line-height:2.2;margin-bottom:50px}
.start-btn{padding:14px 48px;background:#3a3028;color:#f0e8d8;border:none;font-size:14px;letter-spacing:4px;cursor:pointer;transition:all .3s}
.start-btn:active{transform:scale(0.97)}
.start-footer{margin-top:40px;font-size:11px;color:#c8b898}

/* 题目页 */

.r-header{text-align:center;margin-bottom:40px}

.radar-wrap{background:#fff;border:1px solid #e8e0d0;padding:28px 20px 20px;margin-bottom:20px}

.dim-vl{font-size:12px;color:#a89878}

.book{padding:14px 0;border-bottom:1px solid #ece4d4}
.book:last-child{border-bottom:none}
.book-tag{display:inline-block;padding:2px 10px;background:#f0e8d8;font-size:10px;color:#a89878;margin-bottom:6px}

.book-d{font-size:13px;color:#7a6e5e;line-height:1.8}
.divider{width:40px;height:1px;background:#d8d0c0;margin:0 auto 36px}
.r-acts{display:flex;gap:12px;margin-top:48px}
.r-btn{flex:1;padding:14px 0;text-align:center;font-size:13px;letter-spacing:2px;cursor:pointer;border:1px solid #d0c8b8;background:#fff;color:#5a5040}
.r-btn.pri{background:#3a3028;color:#f0e8d8;border-color:#3a3028}

/* 分享卡片 */
.share-card{background:#f8f4ed;border:1px solid #e0d8c8;padding:32px 28px;margin-top:24px;text-align:center;display:none}
.share-card.show{display:block}
.sc-label{font-size:10px;color:#b8a88a;letter-spacing:4px;margin-bottom:16px}
.sc-name{font-size:1.6em;color:#3a3028;margin-bottom:6px}
.sc-src{font-size:12px;color:#a89878;margin-bottom:14px}
.sc-poem{font-size:13px;color:#7a6e5e;line-height:2;margin-bottom:16px;font-style:italic}
.sc-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.sc-tag{padding:3px 10px;background:#f0e8d8;font-size:10px;color:#8a7a5a}
.sc-dims{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}

.sc-footer{font-size:10px;color:#c8b898;letter-spacing:2px;border-top:1px solid #e8e0d0;padding-top:12px}
.ss-tip{text-align:center;font-size:12px;color:#a89878;margin-top:12px;display:none}
.ss-tip.show{display:block}

<script>
// 题目数据
var Q=[{s:"壹 · 关于清晨",t:"闹钟响了，你从梦中醒来。窗帘缝隙里漏进一线光。你睁开眼的第一个念头是——",o:[{t:"今天有很多事要做，赶紧起来，别浪费时间",v:{W:2,P:0,S:1,C:2,A:-1,E:-1}},{t:"再躺五分钟吧……刚才那个梦还没做完",v:{W:-1,P:1,S:-1,C:-1,A:1,E:0}},{t:"那道光真好看，像是有人在窗外悄悄放了一把金子",v:{W:-1,P:0,S:0,C:-1,A:0,E:1}},{t:"又是新的一天。不知道今天会遇见什么人，发生什么事",v:{W:0,P:1,S:0,C:0,A:1,E:0}}]},{s:"贰 · 关于孤独",t:"深夜独坐，窗外起了风，万籁俱寂之中你忽然听见自己心跳的声音。此刻你想——",o:[{t:"推窗而出，趁着月色去走一走，天地便是最好的酒友",v:{W:0,P:1,S:1,C:0,A:2,E:0}},{t:"点一盏灯，铺开纸墨，把这份安静酿成文字",v:{W:-1,P:0,S:0,C:1,A:0,E:1}},{t:"想起一个人，那些旧事像月光一样铺满了整个房间",v:{W:0,P:2,S:-1,C:-1,A:0,E:0}},{t:"什么也不做，就这样静静坐着，与黑暗和解",v:{W:-2,P:-1,S:0,C:1,A:0,E:2}}]},{s:"叁 · 关于远方",t:"如果给你一次穿越的机会，你会选择去往——",o:[{t:"盛唐长安，万国来朝，在最繁华的街头纵马高歌",v:{W:2,P:2,S:1,C:0,A:2,E:-1}},{t:"魏晋山林，与竹林七贤对饮，醉后抚琴一曲",v:{W:-2,P:1,S:-1,C:0,A:1,E:2}},{t:"南宋江南，在烟雨中撑一把油纸伞，走过断桥",v:{W:0,P:2,S:-1,C:-1,A:0,E:0}},{t:"先秦旷野，天地洪荒，做一个最原始的自由人",v:{W:-1,P:0,S:1,C:0,A:2,E:1}}]},{s:"肆 · 关于离别",t:"送别一位挚友远行，你最可能的反应是——",o:[{t:"\"去吧！天大地大，咱们后会有期，这杯酒干了！\"",v:{W:1,P:1,S:2,C:0,A:1,E:0}},{t:"\"你走以后，这座城里我大概会少去很多地方。\"",v:{W:0,P:2,S:-2,C:0,A:-1,E:0}},{t:"什么都说不出口，只是用力握了握对方的手",v:{W:0,P:1,S:0,C:0,A:0,E:1}},{t:"\"聚散皆是缘，你我山水之间，各自珍重便好。\"",v:{W:-1,P:-1,S:0,C:2,A:0,E:1}}]},{s:"伍 · 关于春天",t:"春日午后，你推开门，发现院中的花一夜之间全开了。你的第一反应——",o:[{t:"赶紧叫上三五好友来赏花饮酒，好春光不可辜负",v:{W:2,P:1,S:0,C:0,A:1,E:-1}},{t:"心头一颤——这么美的东西，很快就要凋零了",v:{W:0,P:2,S:-1,C:-1,A:0,E:0}},{t:"搬一把椅子坐在花下，什么也不想，就这么待着",v:{W:-1,P:0,S:0,C:0,A:0,E:2}},{t:"仔细端详每一朵花的姿态，在心中默默为它们取名",v:{W:0,P:0,S:0,C:1,A:0,E:1}}]},{s:"陆 · 关于挫折",t:"人生遭遇了一次重大的失意——落榜、失业、分手。你会如何自处？",o:[{t:"大醉一场，醒来拍拍灰，天生我材必有用",v:{W:1,P:1,S:2,C:0,A:1,E:0}},{t:"找一个没人认识我的地方，从头开始",v:{W:0,P:0,S:1,C:1,A:2,E:0}},{t:"反复回想哪里出了错，夜里翻来覆去睡不着",v:{W:0,P:2,S:-2,C:-1,A:0,E:0}},{t:"去山里住一阵，听听溪水鸟鸣，等心自己慢慢静下来",v:{W:-2,P:-1,S:0,C:0,A:0,E:2}}]},{s:"柒 · 关于月亮",t:"中秋之夜，你抬头望月。月亮在你眼中是——",o:[{t:"一壶酒的引子，举杯邀月，对影成三人",v:{W:0,P:1,S:0,C:0,A:2,E:1}},{t:"远方某个人也在看的同一轮月，此刻心意相通",v:{W:1,P:2,S:0,C:-1,A:0,E:0}},{t:"亘古不变的旁观者，它看过太多人间的悲欢离合",v:{W:0,P:0,S:0,C:2,A:0,E:2}},{t:"清辉如水，洒在身上像一件薄薄的衣裳",v:{W:-1,P:0,S:-1,C:0,A:0,E:1}}]},{s:"捌 · 关于爱情",t:"你理想中的爱情，更接近哪一种？",o:[{t:"烈酒般轰轰烈烈，哪怕飞蛾扑火也在所不惜",v:{W:1,P:2,S:1,C:-2,A:0,E:-1}},{t:"细水长流，柴米油盐里的温柔，平淡即是真",v:{W:2,P:0,S:0,C:1,A:-1,E:0}},{t:"可遇不可求，最好的爱是彼此成全后的转身",v:{W:0,P:1,S:0,C:1,A:0,E:1}},{t:"灵魂共振，不必朝夕相对，心中有你便是永恒",v:{W:-1,P:1,S:0,C:0,A:1,E:1}}]},{s:"玖 · 关于雨天",t:"走在路上突然下起了雨，你没有带伞。你会——",o:[{t:"索性淋着走，甚至张开双臂，享受这突如其来的痛快",v:{W:0,P:1,S:2,C:-1,A:2,E:0}},{t:"跑到最近的屋檐下，看雨丝织成一幅水墨画",v:{W:0,P:0,S:0,C:0,A:0,E:2}},{t:"听着雨声，莫名想起很多往事，眼眶有些湿润",v:{W:0,P:2,S:-2,C:-1,A:0,E:0}},{t:"不疾不徐地继续走，雨也好晴也好，都是寻常",v:{W:0,P:-1,S:1,C:2,A:0,E:1}}]},{s:"拾 · 关于理想",t:"如果人生只能追求一样东西，你选——",o:[{t:"功业。大丈夫当立不世之功，名垂青史",v:{W:2,P:1,S:2,C:1,A:0,E:-2}},{t:"自由。不为五斗米折腰，天地任我逍遥",v:{W:-2,P:0,S:1,C:0,A:2,E:1}},{t:"至情。得一人心，白首不离，此生足矣",v:{W:1,P:2,S:0,C:-1,A:-1,E:0}},{t:"宁静。内心的安定，比什么都珍贵",v:{W:-1,P:-2,S:0,C:1,A:0,E:2}}]},{s:"拾壹 · 关于饮酒",t:"若以酒喻你的性情，你觉得自己更像——",o:[{t:"烈酒。入喉如火，一饮而尽才够痛快",v:{W:1,P:2,S:2,C:-1,A:1,E:0}},{t:"黄酒。温热绵长，后劲悠远，越品越有味",v:{W:1,P:0,S:0,C:1,A:0,E:0}},{t:"花酿。清甜微醺，带着春天的气息",v:{W:0,P:1,S:-2,C:0,A:0,E:0}},{t:"清茶。不算酒，但我更爱这份清醒的自持",v:{W:-1,P:-2,S:0,C:2,A:0,E:1}}]},{s:"拾贰 · 关于故乡",t:"离家多年，最让你魂牵梦萦的是——",o:[{t:"一条老巷子，青石板路上有我跑过的痕迹",v:{W:0,P:1,S:0,C:0,A:0,E:1}},{t:"母亲灶台上的烟火气，那个味道再也复刻不了",v:{W:2,P:2,S:-1,C:0,A:-1,E:0}},{t:"少年时仰望过的那片星空，干净得不像话",v:{W:-1,P:0,S:0,C:0,A:1,E:2}},{t:"其实我不太回头看，前方永远比故乡更吸引我",v:{W:0,P:-1,S:2,C:1,A:2,E:0}}]},{s:"拾叁 · 关于生死",t:"一个沉重却绕不开的问题——你如何看待生命的终点？",o:[{t:"死当马革裹尸还，活着就要活得轰轰烈烈",v:{W:2,P:2,S:2,C:0,A:0,E:-1}},{t:"\"人生如逆旅，我亦是行人\"——坦然接受便好",v:{W:0,P:-1,S:1,C:2,A:0,E:1}},{t:"最怕的不是死，是遗忘。怕爱过的人忘了我",v:{W:1,P:2,S:-1,C:-1,A:0,E:0}},{t:"\"死去何所道，托体同山阿\"——回归天地，未尝不是归处",v:{W:-2,P:-1,S:0,C:1,A:0,E:2}}]},{s:"拾肆 · 关于争执",t:"你和一个重要的人发生了激烈的争吵，事后你会——",o:[{t:"冷静下来分析谁对谁错，该道歉就道歉，就事论事",v:{W:1,P:0,S:1,C:2,A:0,E:0}},{t:"虽然知道自己有道理，但还是先低头，不想失去这段关系",v:{W:1,P:1,S:-2,C:0,A:0,E:0}},{t:"一个人待着消化情绪，等气消了再说，但心里的结可能很久都解不开",v:{W:0,P:1,S:0,C:0,A:0,E:2}},{t:"说了就说了，过去就过去，不喜欢翻旧账",v:{W:0,P:-1,S:1,C:0,A:1,E:0}}]},{s:"拾伍 · 关于音乐",t:"深夜一个人戴着耳机，你最想听到的声音是——",o:[{t:"大提琴或古琴，低沉悠远，像大地在呼吸",v:{W:0,P:0,S:0,C:1,A:0,E:2}},{t:"一首能让你哭出来的歌，有时候眼泪是最好的解药",v:{W:0,P:2,S:-1,C:-1,A:0,E:0}},{t:"节奏强烈的摇滚或说唱，感觉血液都在燃烧",v:{W:1,P:1,S:2,C:-1,A:1,E:-1}},{t:"雨声、风声、虫鸣……自然的白噪音就够了",v:{W:-2,P:-1,S:0,C:0,A:0,E:2}}]},{s:"拾陆 · 关于选择",t:"面前有两条路：一条安稳但平庸，一条精彩但充满风险。你——",o:[{t:"毫不犹豫选风险那条，人生就该轰轰烈烈",v:{W:0,P:1,S:2,C:-1,A:2,E:0}},{t:"理性评估后再决定，冲动是魔鬼",v:{W:1,P:0,S:0,C:2,A:0,E:0}},{t:"选安稳的，但心里会一直惦记另一条路",v:{W:1,P:1,S:-1,C:0,A:0,E:0}},{t:"能不能不选？我想在路边坐一会儿",v:{W:-1,P:0,S:-1,C:0,A:0,E:2}}]},{s:"拾柒 · 关于陌生人",t:"在旅途中，一个陌生人向你讲述了自己的故事。你——",o:[{t:"认真听完，甚至眼眶湿润，替对方的遭遇感到难过",v:{W:2,P:2,S:0,C:-1,A:0,E:-1}},{t:"听着听着，开始想到自己类似的经历",v:{W:0,P:1,S:0,C:0,A:0,E:0}},{t:"觉得有趣，每个人都是一本书，世界真奇妙",v:{W:0,P:0,S:0,C:1,A:2,E:1}},{t:"礼貌地听着，但内心保持距离，不太想介入别人的人生",v:{W:-1,P:-1,S:0,C:1,A:0,E:2}}]},{s:"拾捌 · 关于深夜",t:"凌晨三点，整个城市都睡着了，只有你还醒着。这个时刻对你来说是——",o:[{t:"最好的工作时间，安静高效，灵感都在这时候来",v:{W:1,P:0,S:1,C:1,A:0,E:1}},{t:"最脆弱的时刻，白天藏好的情绪全跑出来了",v:{W:0,P:2,S:-2,C:-1,A:0,E:0}},{t:"最自由的时刻，不用扮演任何角色，终于可以做自己",v:{W:-1,P:0,S:0,C:0,A:2,E:1}},{t:"有点荒凉，但这种荒凉让人上瘾",v:{W:-1,P:0,S:0,C:0,A:0,E:2}}]},{s:"拾玖 · 关于遗憾",t:"回望过去，最让你耿耿于怀的遗憾类型是——",o:[{t:"没有勇敢去做的事——那些\"差一点就\"的冒险",v:{W:0,P:1,S:1,C:0,A:2,E:0}},{t:"没有好好珍惜的人——那些来不及说的话",v:{W:1,P:2,S:-1,C:0,A:0,E:0}},{t:"没有坚持到底的理想——向现实妥协的那些瞬间",v:{W:1,P:1,S:2,C:0,A:0,E:-1}},{t:"说不上来，就是一种模糊的怅惘，像雾一样散不开",v:{W:0,P:1,S:0,C:-1,A:0,E:2}}]},{s:"贰拾 · 关于归宿",t:"如果可以选择，你希望生命最后的画面是——",o:[{t:"在一件伟大的事业中燃尽，像流星划过夜空",v:{W:2,P:2,S:2,C:0,A:0,E:-1}},{t:"爱人握着你的手，窗外有阳光，岁月静好",v:{W:2,P:1,S:0,C:0,A:-1,E:0}},{t:"一个人在山间小屋，炉火将熄，雪落无声",v:{W:-2,P:-1,S:0,C:1,A:0,E:2}},{t:"在路上——哪怕走不动了，脸也朝着远方",v:{W:0,P:0,S:1,C:0,A:2,E:1}}]}];

var bH='<div class="section"><div class="section-title">▤ 精神食粮</div>';for(var i=0;i<bks.length;i++){var b=bks[i];bH+='<div class="book"><div class="book-tag">'+(b.g||'')+'</div><div class="book-t">《'+(b.t||'')+'》</div><div class="book-a">'+(b.a||'')+'</div><div class="book-d">'+(b.d||'')+'</div></div>';}bH+='</div>';p.push(bH);

p.push('<div class="r-acts"><button class="r-btn" onclick="sw(\'pg2\',\'pg0\')">再测一次</button><button class="r-btn pri" onclick="shs()">生成分享卡片</button></div>');
document.getElementById('rC').innerHTML=p.join('');
sw('pg1','pg2');
setTimeout(function(){try{var dlb=[],dvl=[];for(var i=0;i<dk.length;i++){dlb.push(dn[dk[i]]);dvl.push(dv[dk[i]]);}dr(dlb,dvl);}catch(e){}},300);
}

function shs(){var c=document.getElementById('sCard'),t=document.getElementById('ssTip');if(c.className.indexOf('show')>=0){c.className='share-card';t.className='ss-tip';}else{c.className='share-card show';t.className='ss-tip show';setTimeout(function(){c.scrollIntoView({behavior:'smooth',block:'center'});},100);}}

function dr(lb,vl){var cv=document.getElementById('rc');if(!cv)return;var cx=cv.getContext('2d'),W=cv.width,H=cv.height,mx=W/2,my=H/2,MR=Math.min(W,H)/2-45,n=lb.length,as=Math.PI*2/n,sa=-Math.PI/2;cx.clearRect(0,0,W,H);for(var l=1;l<=4;l++){var r=MR*l/4;cx.beginPath();for(var i=0;i<=n;i++){var a=sa+i*as,x=mx+r*Math.cos(a),y=my+r*Math.sin(a);i===0?cx.moveTo(x,y):cx.lineTo(x,y);}cx.closePath();cx.strokeStyle='rgba(200,184,152,0.25)';cx.lineWidth=1;cx.stroke();}for(var i=0;i<n;i++){var a=sa+i*as;cx.beginPath();cx.moveTo(mx,my);cx.lineTo(mx+MR*Math.cos(a),my+MR*Math.sin(a));cx.strokeStyle='rgba(200,184,152,0.3)';cx.stroke();}cx.beginPath();for(var i=0;i<=n;i++){var j=i%n,a=sa+j*as,r=MR*vl[j]/100,x=mx+r*Math.cos(a),y=my+r*Math.sin(a);i===0?cx.moveTo(x,y):cx.lineTo(x,y);}cx.closePath();cx.fillStyle='rgba(180,140,90,0.15)';cx.fill();cx.strokeStyle='rgba(160,120,70,0.6)';cx.lineWidth=2;cx.stroke();for(var i=0;i<n;i++){var a=sa+i*as,r=MR*vl[i]/100;cx.beginPath();cx.arc(mx+r*Math.cos(a),my+r*Math.sin(a),4,0,Math.PI*2);cx.fillStyle='#a08060';cx.fill();}cx.font='20px serif';cx.fillStyle='#7a6e5e';cx.textAlign='center';cx.textBaseline='middle';for(var i=0;i<n;i++){var a=sa+i*as,lr=MR+30;cx.fillText(lb[i],mx+lr*Math.cos(a),my+lr*Math.sin(a));}}

function sw(a,b){document.getElementById(a).className='page';document.getElementById(b).className='page active';window.scrollTo(0,0);}
</script>
